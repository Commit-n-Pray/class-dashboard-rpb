<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Resmi X-RPB SKARIGA | Login Entrance 2020</title>
  <meta name="description" content="Website resmi kelas XII MIPA 1 dengan Login Entrance 2020. Masuk untuk melihat jadwal, tugas, profil, dan kas.">
  <script>
(() => {
    document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("theme_preference") || "dark"
    );
})();
</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HALAMAN UTAMA LOGIN (LOGIN GATEWAY LANDING 2020) -->
  <div class="login-landing-container" id="login-landing-view">
    <div class="login-top-bar">
      <button class="theme-toggle-btn" title="Ganti Mode Tampilan">🌙</button>
    </div>

    <div class="login-card-2020">
      <div class="login-header-branding">
        <img src="Assets/xrpb.jpg" alt="Logo Sekolah" class="login-logo">
        <h1 class="login-title">X-RPB SKARIGA PORTAL</h1>
        <p class="login-subtitle">SMKS PGRI 3 MALANG • CLASS OF 2026-2029</p>
      </div>

      <form id="landing-login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="form-group">
          <label style="font-weight: 700; font-size: 0.85rem;">Pilih Role / Hak Akses:</label>
          <div class="role-selector-grid">
            <div class="role-card-opt selected" data-role="siswa" onclick="APP.selectRole('siswa')">
              <span class="role-icon"></span>
              <span class="role-name">Siswa / Tamu</span>
            </div>
            <div class="role-card-opt" data-role="pengurus" onclick="APP.selectRole('pengurus')">
              <span class="role-name">Pengurus Kelas</span>
            </div>
            <div class="role-card-opt" data-role="walikelas" onclick="APP.selectRole('walikelas')">
              <span class="role-name">Wali Kelas</span>
            </div>
            <div class="role-card-opt" data-role="dev" onclick="APP.selectRole('dev')">
              <span class="role-name">Developer</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="landing-name-input">Nama Pengguna:</label>
          <input type="text" id="landing-name-input" class="form-control" placeholder="Masukkan nama Anda (Opsional)..." required>
        </div>

        <div class="form-group" id="landing-pass-group" style="display: none;">
          <label for="landing-pass-input">PIN / Password Akses:</label>
          <input type="password" id="landing-pass-input" class="form-control" placeholder="Masukkan PIN Role...">
          <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 0.25rem;">
             <strong>PIN Demo Akses:</strong><br>
            • Pengurus Kelas: <code>1234</code><br>
            • Wali Kelas: <code>guru123</code><br>
            • Developer: <code>dev123</code>
          </small>
        </div>

        <button type="submit" class="btn-login" style="width: 100%; padding: 0.85rem; justify-content: center; font-size: 1rem;">
           Masuk Ke Portal Kelas
        </button>
      </form>

      <div style="text-align: center; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1rem;">
        Website Resmi Kelas X-RPB SKARIGA
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
